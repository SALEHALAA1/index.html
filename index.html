<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badgeify</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #f39c12;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            color: #121212;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>إضافة عميل جديد</h2>
        <form id="customerForm">
            <div class="form-group">
                <label for="customerName">اسم العميل (أو دمج مع جهة)</label>
                <input type="text" id="customerName" required placeholder="أدخل اسم العميل">
            </div>

            <div class="form-group">
                <label for="mobileNumber">رقم الموبايل / واتساب</label>
                <input type="text" id="mobileNumber" required placeholder="01xxxxxxxx0">
            </div>

            <div class="form-group">
                <label for="agentName">التاجر التابع له (اختياري)</label>
                <select id="agentName">
                    <option value="بدون تاجر (عميل مباشر)">بدون تاجر (عميل مباشر)</option>
                    <!-- أضف التجار هنا حسب الحاجة -->
                </select>
            </div>

            <div class="form-group">
                <label for="serviceType">نوع الخدمة</label>
                <input type="text" id="serviceType" placeholder="مثال: توثيق فيس بوك">
            </div>

            <div class="form-group">
                <label for="price">السعر</label>
                <input type="number" id="price" placeholder="350">
            </div>

            <div class="form-group">
                <label for="quantity">الكمية</label>
                <input type="number" id="quantity" value="1">
            </div>

            <div class="form-group">
                <label for="notes">ملاحظات عامة</label>
                <textarea id="notes" rows="3" placeholder="ملاحظات إضافية..."></textarea>
            </div>

            <button type="submit" id="saveBtn">حفظ البيانات</button>
        </form>
    </div>

    <script>
        // إعدادات الاتصال بـ Supabase والمفتاح الصحيح
        const SUPABASE_URL = 'https://rsvzachgbqsucqgrwguv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdnphY2hnYnFzdWNxZ3J3Z3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODA5MTYsImV4cCI6MjEwNTI1NjkxNn0.5r-YQOaFhjRDuaqdHTRWP6k-mCb0Z6AY_q2ExN_2wCQ';

        // تهيئة عميل Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // الاستماع لحدث الضغط على زر حفظ البيانات وإرسالها للجدول
        document.getElementById('customerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('saveBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الحفظ...';

            // تجميع البيانات من النموذج
            const customerData = {
                customer_name: document.getElementById('customerName').value,
                mobile_number: document.getElementById('mobileNumber').value,
                agent_name: document.getElementById('agentName').value,
                service_type: document.getElementById('serviceType').value,
                price: parseFloat(document.getElementById('price').value) || 0,
                quantity: parseInt(document.getElementById('quantity').value) || 1,
                notes: document.getElementById('notes').value
            };

            try {
                // إرسال البيانات إلى جدول customers في قاعدة البيانات
                const { data, error } = await supabaseClient
                    .from('customers')
                    .insert([customerData]);

                if (error) {
                    throw error;
                }

                alert('تم حفظ البيانات بنجاح!');
                document.getElementById('customerForm').reset(); // تفريغ الحقول بعد الحفظ
            } catch (error) {
                alert('Error: ' + error.message);
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ البيانات';
            }
        });
    </script>
</body>
</html>
