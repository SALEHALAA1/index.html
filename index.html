<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BADGEIFY CRM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --bg:#090b0f;
    --panel:#11151b;
    --panel2:#171c23;
    --border:#252c35;
    --text:#f4f5f7;
    --muted:#9299a5;
    --gold:#d6b35a;
    --gold2:#f1d98d;
    --green:#35c98a;
    --red:#ef6262;
    --blue:#5da8ff;
    --shadow:0 18px 50px rgba(0,0,0,.28);
}

body.light{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --panel2:#f0f2f5;
    --border:#dfe3e8;
    --text:#17191d;
    --muted:#69717d;
    --shadow:0 12px 35px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Cairo,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(214,179,90,.13),
        transparent 35%
    ),
    var(--bg);
}

.login-box{
    width:min(430px,100%);
    padding:35px;

    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;

    box-shadow:var(--shadow);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.logo-icon{
    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    color:#111;
    font-size:22px;
    font-weight:900;
}

.logo-title{
    font-size:22px;
    font-weight:800;
}

.logo-sub{
    color:var(--muted);
    font-size:11px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:11px 12px;

    border:1px solid var(--border);
    border-radius:10px;

    outline:none;

    background:var(--panel2);
    color:var(--text);
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--gold);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

/* APP */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;

    right:0;
    top:0;
    bottom:0;

    width:270px;

    background:var(--panel);
    border-left:1px solid var(--border);

    padding:20px 15px;

    z-index:20;

    overflow:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:7px 8px 22px;
}

.brand .logo-icon{
    width:44px;
    height:44px;
}

.brand-name{
    font-weight:800;
    font-size:20px;
}

.brand-sub{
    color:var(--muted);
    font-size:10px;
}

.nav-title{
    color:var(--muted);
    font-size:10px;
    margin:15px 10px 7px;
}

.nav button{
    width:100%;

    border:0;

    background:transparent;
    color:var(--muted);

    padding:11px 13px;

    border-radius:11px;

    display:flex;
    align-items:center;
    gap:11px;

    text-align:right;

    margin:3px 0;
}

.nav button:hover,
.nav button.active{
    background:rgba(214,179,90,.12);
    color:var(--gold2);
}

.nav i{
    width:19px;
    text-align:center;
}

.main{
    width:calc(100% - 270px);
    margin-right:270px;
}

.topbar{
    height:74px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;

    background:rgba(9,11,15,.90);

    backdrop-filter:blur(15px);

    z-index:10;
}

body.light .topbar{
    background:rgba(243,244,246,.90);
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn,
.ghost-btn,
.gold-btn,
.red-btn,
.mini-btn{
    border:1px solid var(--border);

    border-radius:10px;

    background:var(--panel);
    color:var(--text);

    padding:9px 12px;
}

.icon-btn{
    width:42px;
    height:42px;
    padding:0;
}

.gold-btn{
    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    border-color:transparent;

    color:#111;
    font-weight:800;
}

.red-btn{
    background:var(--red);
    color:white;
    border-color:transparent;
}

.ghost-btn:hover,
.icon-btn:hover,
.mini-btn:hover{
    border-color:var(--gold);
}

.content{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.page-head h1{
    margin:0;
    font-size:27px;
}

.page-head p{
    margin:5px 0 0;

    color:var(--muted);
    font-size:12px;
}

.page-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* CARDS */

.grid{
    display:grid;
    gap:16px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.stat{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    padding:20px;

    box-shadow:var(--shadow);
}

.stat-icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:rgba(214,179,90,.12);

    color:var(--gold2);

    margin-bottom:13px;
}

.stat h2{
    margin:0;
    font-size:26px;
}

.stat p{
    margin:4px 0 0;

    color:var(--muted);
    font-size:11px;
}

.card{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow);
}

.card-head{
    padding:16px 18px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.card-head h3{
    margin:0;
    font-size:14px;
}

.card-body{
    padding:18px;
}

.cols{
    grid-template-columns:1.4fr 1fr;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

.table th,
.table td{
    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:right;

    font-size:11px;

    vertical-align:middle;
}

.table th{
    color:var(--muted);
}

.table tr:hover td{
    background:rgba(214,179,90,.035);
}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.mini-btn{
    padding:6px 8px;
    font-size:10px;
}

.mini-btn.wa{
    color:#36d995;
}

.mini-btn.pay{
    color:var(--gold2);
}

.badge{
    display:inline-flex;

    padding:5px 9px;

    border-radius:999px;

    font-size:9px;

    font-weight:700;
}

.badge.paid{
    background:rgba(53,201,138,.13);
    color:var(--green);
}

.badge.overdue{
    background:rgba(239,98,98,.13);
    color:var(--red);
}

.badge.due{
    background:rgba(214,179,90,.13);
    color:var(--gold2);
}

.badge.upcoming{
    background:rgba(93,168,255,.12);
    color:var(--blue);
}

.badge.inactive{
    background:rgba(140,150,165,.13);
    color:var(--muted);
}

/* SEARCH */

.search{
    display:flex;
    gap:8px;

    margin-bottom:15px;
}

.search input,
.search select{
    padding:10px;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);

    border-radius:10px;
}

/* CALENDAR */

.calendar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.day{
    min-height:125px;

    background:var(--panel2);

    border:1px solid var(--border);

    border-radius:13px;

    padding:10px;
}

.day.today{
    border-color:var(--gold);
}

.day-head{
    display:flex;
    justify-content:space-between;

    font-size:10px;

    margin-bottom:7px;
}

.day-head b{
    color:var(--gold2);
}

.event{
    padding:7px;

    border-radius:7px;

    background:var(--panel);

    font-size:9px;

    margin-top:5px;

    border-right:3px solid var(--gold);
}

.event.over{
    border-right-color:var(--red);
}

/* LIST */

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.list-item{
    background:var(--panel2);

    border-radius:10px;

    padding:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.muted{
    color:var(--muted);
}

.money{
    color:var(--gold2);
    font-weight:800;
}

/* MODAL */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.67);

    backdrop-filter:blur(5px);

    display:grid;

    place-items:center;

    padding:15px;

    z-index:100;
}

.modal-box{
    width:min(800px,100%);

    max-height:92vh;

    overflow:auto;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:20px;

    box-shadow:0 30px 90px #0008;
}

.modal-head{
    padding:16px 20px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.modal-head h3{
    margin:0;
}

.modal-body{
    padding:20px;
}

.modal-foot{
    padding:14px 20px;

    border-top:1px solid var(--border);

    display:flex;

    gap:8px;
}

/* TOAST */

.toast{
    position:fixed;

    bottom:20px;
    left:20px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:12px;

    padding:13px 16px;

    z-index:200;

    box-shadow:var(--shadow);
}

.toast.ok{
    border-color:rgba(53,201,138,.5);
}

.toast.err{
    border-color:rgba(239,98,98,.5);
}

.empty{
    text-align:center;

    padding:30px 10px;

    color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .cols{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        width:72px;
        padding:15px 7px;
    }

    .brand-name,
    .brand-sub,
    .nav-title,
    .nav span{
        display:none;
    }

    .brand{
        justify-content:center;
    }

    .nav button{
        justify-content:center;
    }

    .main{
        width:calc(100% - 72px);
        margin-right:72px;
    }

    .content{
        padding:16px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:1fr;
    }

    .page-head{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>

/* =========================================
   UI HELPERS
========================================= */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(x){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[x];

    });

}


function money(value){

    return new Intl.NumberFormat(
        state.lang==="ar"?"ar-EG":"en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(Number(value||0));

}


function dateOnly(value){

    if(!value) return null;

    const p=
    String(value)
    .slice(0,10)
    .split("-")
    .map(Number);

    return new Date(
        p[0],
        p[1]-1,
        p[2]
    );

}


function isoDate(date){

    const y=date.getFullYear();

    const m=
    String(date.getMonth()+1)
    .padStart(2,"0");

    const d=
    String(date.getDate())
    .padStart(2,"0");

    return `${y}-${m}-${d}`;

}


function formatDate(value){

    const d=dateOnly(value);

    if(!d) return "-";

    return new Intl.DateTimeFormat(
        state.lang==="ar"?"ar-EG":"en-GB",
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    ).format(d);

}


function monthKey(date){

    return date.getFullYear()
    +"-"
    +String(date.getMonth()+1).padStart(2,"0");

}


function clampDay(year,month,day){

    return Math.min(
        Number(day||1),
        new Date(year,month+1,0).getDate()
    );

}


/* =========================================
   PAYMENT DATE
========================================= */

/*
    لا يوجد تاريخ بداية
    ولا يوجد تاريخ تجديد.

    يوم الدفع فقط هو الأساس.
*/

function subscriptionDueDate(subscription){

    const now=new Date();

    const day=
    Number(
        subscription.payment_day
        ||subscription.renewal_day
        ||1
    );

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        clampDay(
            now.getFullYear(),
            now.getMonth(),
            day
        )
    );

}


function paymentExistsForPeriod(
    subscription,
    dueDate
){

    const key=monthKey(dueDate);

    return state.payments.some(function(payment){

        return Number(payment.subscription_id)
        ===Number(subscription.id)

        &&
        payment.paid_month===key;

    });

}


function getPaymentState(subscription){

    if(subscription.status==="inactive"){

        return {
            type:"inactive",
            text:t("inactive")
        };

    }

    const due=
    subscriptionDueDate(subscription);

    if(
        paymentExistsForPeriod(
            subscription,
            due
        )
    ){

        return {
            type:"paid",
            text:t("paid")
        };

    }

    const today=
    dateOnly(isoDate(new Date()));

    const diff=
    Math.round(
        (today-due)/86400000
    );

    if(diff>0){

        return {
            type:"overdue",
            text:
            state.lang==="ar"
            ?
            `${t("overdue")} ${diff} يوم`
            :
            `${diff} days overdue`
        };

    }

    if(diff===0){

        return {
            type:"due",
            text:t("dueToday")
        };

    }

    return {
        type:"upcoming",
        text:t("upcoming")
    };

}


function statusBadge(subscription){

    const st=
    getPaymentState(subscription);

    return `
    <span class="badge ${st.type}">
        ${esc(st.text)}
    </span>
    `;

}

async function loadTable(table){

    const result=
    await db
    .from(table)
    .select("*");

    if(result.error)
        throw result.error;

    return result.data||[];

}


async function loadData(){

    const result=
    await Promise.all([

        loadTable("customers"),
        loadTable("traders"),
        loadTable("app_services"),
        loadTable("subscriptions"),
        loadTable("subscription_payments"),
        loadTable("invoices"),
        loadTable("invoice_items"),
        loadTable("followups"),
        loadTable("activity_logs"),
        loadTable("app_settings")

    ]);

    state.customers=result[0];
    state.traders=result[1];
    state.services=result[2];
    state.subscriptions=result[3];
    state.payments=result[4];
    state.invoices=result[5];
    state.invoiceItems=result[6];
    state.followups=result[7];
    state.logs=result[8];

    state.settings={};

    result[9].forEach(function(row){

        state.settings[
            row.setting_key
        ]=row.setting_value;

    });

}

function whatsappNumber(phone){

    let number=
    String(phone||"")
    .replace(/\D/g,"");

    if(!number)
        return "";

    if(number.startsWith("0"))
        number="20"+number.substring(1);

    return number;

}

        ||
        "تم تأكيد استلام دفعتك يا {{client_name}} بقيمة {{amount}} {{currency}}.\nشكراً لتعاملك معنا.",

        ||

function buildWhatsAppMessage(
    template,
    customer,
    subscription
){

    const service=
    subscription?
    getService(subscription.app_service_id):
    null;

    const due=
    subscription?
    subscriptionDueDate(subscription):
    null;

    const values={

        client_name:
        customer?.client_name||"",

        phone:
        customer?.phone||"",

        service_name:
        service?.service_name||"",

        amount:
        subscription?
        money(subscription.monthly_fee):
        "",

        currency:
        subscription?.currency
        ||
        state.settings.currency
        ||
        "EGP",

        due_date:
        due?
        formatDate(due):
        "",

        page_name:
        subscription?.page_name||"",

        platform:
        subscription?.platform||"",

        company_name:
        state.settings.company_name
        ||
        "BADGEIFY"

    };

    return template.replace(
        /{{(\w+)}}/g,
        function(_,key){

            return values[key] ?? "";

        }
    );

}


function sendWhatsApp(
    customerId,
    subscriptionId,
    type
){

    const customer=
    getCustomer(customerId);

    const subscription=
    getSubscription(subscriptionId);

    if(!customer?.phone){

        showToast(
            state.lang==="ar"
            ?"لا يوجد رقم للعميل"
            :"Customer has no phone number",
            true
        );

        return;

    }

    const templates=
    getWhatsAppTemplates();

    const message=
    buildWhatsAppMessage(
        templates[type]||templates.payment,
        customer,
        subscription
    );

    const number=
    whatsappNumber(customer.phone);

    window.open(
        "https://wa.me/"
        +number
        +"?text="
        +encodeURIComponent(message),
        "_blank"
    );

}

function applyTheme(){

    document.body.classList.toggle(
        "light",
        state.theme==="light"
    );

    document.documentElement.lang=
    state.lang;

    document.documentElement.dir=
    state.lang==="ar"?"rtl":"ltr";

    document.getElementById("langBtn")
    .textContent=
    state.lang==="ar"
    ?"EN"
    :"AR";

    document.getElementById("themeBtn")
    .innerHTML=
    state.theme==="dark"
    ?
    '<i class="fa-solid fa-sun"></i>'
    :
    '<i class="fa-solid fa-moon"></i>';

    localStorage.setItem(
        "badgeify_lang",
        state.lang
    );

    localStorage.setItem(
        "badgeify_theme",
        state.theme
    );

}

    state.theme=

    ?"light"
    :"dark";

    applyTheme();

    render();

}

    state.lang=
    state.lang==="ar"
    ?"en"
    :"ar";

    applyTheme();

    render();

}

function renderCalendar(){

    const active=
    state.subscriptions
    .filter(x=>x.status!=="inactive");

    let html="";

    for(
        let i=0;
        i<30;
        i++
    ){

        const date=
        new Date();

        date.setHours(0,0,0,0);

        date.setDate(
            date.getDate()+i
        );

        const dateString=
        isoDate(date);

        const subscriptions=
        active.filter(
            x=>
            isoDate(
                subscriptionDueDate(x)
            )===dateString
        );

        html+=`

        <div class="day
        ${i===0?"today":""}">

            <div class="day-head">

                <b>
                ${i===0
                ?t("today")
                :new Intl.DateTimeFormat(
                    state.lang==="ar"
                    ?"ar-EG"
                    :"en",
                    {weekday:"short"}
                ).format(date)}
                </b>

                <span>
                ${date.getDate()}/${date.getMonth()+1}
                </span>

            </div>

            ${
            subscriptions.length
            ?
            subscriptions.map(function(s){

                const st=
                getPaymentState(s);

                const c=
                getCustomer(s.customer_id);

                return `

                <div
                class="event
                ${st.type==="overdue"?"over":""}"
                onclick="openPaymentModal(${s.id})">

                <b>
                ${esc(c?.client_name||"-")}
                </b>

                <br>

                <span class="muted">

                ${esc(
                    getService(
                        s.app_service_id
                    )?.service_name
                    ||
                    s.platform
                    ||
                    "-"
                )}

                </span>

                </div>

                `;

            }).join("")
            :
            `<span class="muted">—</span>`
            }

        </div>

        `;

    }

    return html;

}


function renderRecentPayments(){

    const rows=
    [...state.payments]
    .sort(
        (a,b)=>
        String(b.payment_date)
        .localeCompare(
            String(a.payment_date)
        )
    )
    .slice(0,7);

    if(!rows.length)
        return `<div class="empty">${t("noData")}</div>`;

    return `

    <div class="list">

    ${
    rows.map(function(payment){

        const s=
        getSubscription(
            payment.subscription_id
        );

        const c=
        getCustomer(
            s?.customer_id
        );

        return `

        <div class="list-item">

            <div>

                <b>
                ${esc(c?.client_name||"-")}
                </b>

                <div class="muted">
                ${formatDate(payment.payment_date)}
                </div>

            </div>

            <span class="money">

            ${money(payment.amount)}
            ${esc(payment.currency||"EGP")}

            </span>

    }).join("")

function sendCustomerWhatsApp(customerId){

    const customer = getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    if(!customer.phone){
        showToast("لا يوجد رقم هاتف للعميل", true);
        return;
    }

    let number = String(customer.phone)
        .replace(/\D/g,"");

    if(number.startsWith("0")){
        number = "20" + number.substring(1);
    }

    if(!number){
        showToast("رقم الهاتف غير صحيح", true);
        return;
    }

    const message =
        "السلام عليكم " +
        (customer.client_name || "") +
        "\n\n" +
        "أهلاً بك في BADGEIFY.";

    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank");
}

async function saveCustomer(id){

        client_name:
        document.getElementById(
            "customerName"
        ).value.trim(),

        client_type:
        document.getElementById(
            "customerType"
        ).value,

        phone:
        document.getElementById(
            "customerPhone"
        ).value.trim(),

        trader_id:
        document.getElementById(
            "customerTrader"
        ).value

        Number(
            document.getElementById(

        :
        null,

        status:
        document.getElementById(
            "customerStatus"
        ).value,

        notes:
        document.getElementById(
            "customerNotes"
        ).value

    };

    if(!data.client_name){

        showToast(
            t("name"),
            true
        );

        return;

    }

    try{

        let result;

        if(id){

            result=
            await db
            .from("customers")
            .update(data)
            .eq("id",id);

        }else{

            result=
            await db
            .from("customers")
            .insert(data);

        if(result.error)
            throw result.error;

        await logActivity(
            id?"UPDATE":"CREATE",
            "customer",
            id,
            data.client_name
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

            error.message,

async function confirmPayment(subscriptionId){

    const s=
    getSubscription(subscriptionId);

    const due=
    subscriptionDueDate(s);

    if(
        paymentExistsForPeriod(
            s,
            due
        )
    ){

        closeModal();

        return;

    }

    const amount=
    Number(
        document.getElementById(
            "paymentAmount"
        ).value||0
    );

    const paymentDate=
    document.getElementById(
        "paymentDate"
    ).value;

    const notes=
    document.getElementById(
        "paymentNotes"
    ).value;

    try{

        const result=
        await db
        .from("subscription_payments")
        .insert({

            subscription_id:
            subscriptionId,

            amount:amount,

            currency:
            s.currency
            ||
            state.settings.currency
            ||
            "EGP",

            payment_date:
            paymentDate,

            paid_month:
            monthKey(due),

            notes:notes

        });

        if(result.error)
            throw result.error;


        await logActivity(
            "PAYMENT",
            "subscription",
            subscriptionId,
            "Confirmed payment"
        );


        closeModal();

        await refresh();

        showToast(
            t("successPayment")
        );

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

async function openTraderPortal(traderId){

    try{

        const { data, error } = await db
            .from("trader_portal_tokens")
            .select("token")
            .eq("trader_id", traderId)
            .eq("is_active", true)
            .limit(1)
            .maybeSingle();

        if(error){

            console.error(error);

            showToast(
                "تعذر الحصول على رابط التاجر",
                true
            );

            return;
        }

        if(!data || !data.token){

            showToast(
                "لا يوجد رابط لهذا التاجر",
                true
            );

            return;
        }

        const portalUrl =
            new URL(
                "trader.html",
                window.location.href
            ).href
            + "?token="
            + encodeURIComponent(data.token);

        window.open(
            portalUrl,
            "_blank"
        );

    }catch(error){

        console.error(error);

        showToast(
            "حدث خطأ أثناء فتح رابط التاجر",
            true
        );

    }

}

async function saveCustomerInvoice(){

    const customerId=
    Number(
        document.getElementById(
            "invoiceCustomer"
        ).value
    );

    const subscriptionId=
    document.getElementById(
        "invoiceSubscription"
    ).value
    ?
    Number(
        document.getElementById(
            "invoiceSubscription"
        ).value
    )
    :
    null;

    const amount=
    Number(
        document.getElementById(
            "invoiceAmount"
        ).value||0
    );

    const discount=
    Number(
        document.getElementById(
            "invoiceDiscount"
        ).value||0
    );

    const total=
    Math.max(
        0,
        amount-discount
    );

    if(!customerId){

        showToast(
            t("customer"),
            true
        );

        return;

    }

    try{

        const number=
        generateInvoiceNumber();

        const result=
        await db
        .from("invoices")
        .insert({

            invoice_number:number,

            customer_id:
            customerId,

            trader_id:null,

            subscription_id:
            subscriptionId,

            invoice_type:"customer",

            invoice_date:
            isoDate(new Date()),

            subtotal:amount,

            discount:discount,

            total:total,

            currency:
            state.settings.currency||"EGP",

            status:
            document.getElementById(
                "invoiceStatus"
            ).value,

            notes:
            document.getElementById(
                "invoiceNotes"
            ).value

        })
        .select()
        .single();

        if(result.error)
            throw result.error;


        if(subscriptionId){

            const s=
            getSubscription(
                subscriptionId
            );

            await db
            .from("invoice_items")
            .insert({

                invoice_id:
                result.data.id,

                subscription_id:
                subscriptionId,

                service_name:
                getService(
                    s?.app_service_id
                )?.service_name
                ||
                "Service",

                quantity:1,

                unit_price:amount,

                discount:discount,

                total:total

            });

        }

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function loadTraderInvoiceSubscriptions(){

    const traderId=
    Number(
        document.getElementById(
            "combinedTrader"
        ).value
    );

    const container=
    document.getElementById(
        "traderInvoiceSubscriptions"
    );

    const totalElement=
    document.getElementById(
        "traderInvoiceTotal"
    );

    if(!traderId){

        container.innerHTML=
        `<div class="empty">${t("chooseTrader")}</div>`;

        totalElement.textContent="";

        return;

    }

    const customerIds=
    state.customers
    .filter(
        c=>
        Number(c.trader_id)
        ===traderId
    )
    .map(c=>Number(c.id));

    const subscriptions=
    state.subscriptions
    .filter(
        s=>
        customerIds.includes(
            Number(s.customer_id)
        )
        &&
        s.status!=="inactive"
    );

    container.innerHTML=`

    <div
    class="card">

        <div class="card-body">

            ${
            subscriptions.map(function(s){

                const c=
                getCustomer(
                    s.customer_id
                );

                const service=
                getService(
                    s.app_service_id
                );

                return `

                <label
                class="list-item"
                style="cursor:pointer">

                    <div>

                        <b>
                        ${esc(c?.client_name||"-")}
                        </b>

                        <div class="muted">

                        )}

                        )}

                        <span class="money">

                        ${money(s.monthly_fee)}
                        ${esc(s.currency||"EGP")}

                        </span>

                        <input
                        type="checkbox"
                        class="traderInvoiceCheck"
                        value="${s.id}"
                        data-amount="${s.monthly_fee||0}"
                        onchange="calculateTraderInvoice()"
                        style="margin-right:10px">

                </label>

                `;

            ||
            `<div class="empty">${t("noData")}</div>`
            }

    `;

    calculateTraderInvoice();

function calculateTraderInvoice(){

    const checks=
    document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    );

    let total=0;

    checks.forEach(function(check){

        total+=
        Number(
            check.dataset.amount||0
        );

    });

    document.getElementById(
        "traderInvoiceTotal"
    ).textContent=
    `${t("total")}: ${money(total)} ${state.settings.currency||"EGP"}`;

}


async function createTraderInvoice(){

    const traderId=
    Number(
        document.getElementById(
            "combinedTrader"
        ).value
    );

    const checks=
    [...document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    )];

    if(!traderId){

        showToast(
            t("chooseTrader"),
            true
        );

        return;

    }

    if(!checks.length){

        showToast(
            t("selectSubscriptions"),
            true
        );

        return;

    }

    const subscriptions=
    checks.map(
        check=>
        getSubscription(
            Number(check.value)
        )
    );

    const subtotal=
    subscriptions.reduce(
        (sum,s)=>
        sum+Number(s.monthly_fee||0),
        0
    );

    try{

        const number=
        generateInvoiceNumber("TR");

        const invoice=
        await db
        .from("invoices")
        .insert({

            invoice_number:number,

            customer_id:null,

            trader_id:traderId,

            subscription_id:null,

            invoice_type:"trader",

            invoice_date:
            isoDate(new Date()),

            subtotal:subtotal,

            discount:0,

            total:subtotal,

            currency:
            state.settings.currency||"EGP",

            status:"unpaid",

            notes:
            "Combined trader invoice"

        })
        .select()
        .single();

        if(invoice.error)
            throw invoice.error;


        const items=
        subscriptions.map(function(s){

            return {

                invoice_id:
                invoice.data.id,

                subscription_id:
                s.id,

                service_name:
                getService(
                    s.app_service_id
                )?.service_name
                ||
                "Service",

                description:
                getCustomer(
                    s.customer_id
                )?.client_name
                ||
                "",

                quantity:1,

                unit_price:
                Number(s.monthly_fee||0),

                discount:0,

                total:
                Number(s.monthly_fee||0)

            };

        });


        const itemsResult=
        await db
        .from("invoice_items")
        .insert(items);

        if(itemsResult.error)
            throw itemsResult.error;


        await logActivity(
            "CREATE",
            "trader_invoice",
            invoice.data.id,
            number
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


function generateInvoiceNumber(prefix="INV"){

    const date=
    new Date();

    return prefix
    +"-"
    +date.getFullYear()
    +String(
        date.getMonth()+1
    ).padStart(2,"0")
    +"-"
    +Date.now()
    .toString()
    .slice(-6);

}

async function saveFollowup(){

    const data={

        customer_id:
        Number(
            document.getElementById(
                "followCustomer"
            ).value
        ),

        followup_date:
        document.getElementById(
            "followDate"
        ).value,

        followup_type:
        document.getElementById(
            "followType"
        ).value,

        title:
        document.getElementById(
            "followTitle"
        ).value,

        notes:
        document.getElementById(
            "followNotes"
        ).value,

        status:"pending"

    };

    if(!data.customer_id)
        return;

    try{

        const result=
        await db
        .from("followups")
        .insert(data);

        if(result.error)
            throw result.error;

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

            error.message,

}

/* =========================================
   CUSTOMER PORTAL
========================================= */

async function openCustomerPortal(customerId){

    try{

        const customer = getCustomer(customerId);

        if(!customer){
            showToast("العميل غير موجود", true);
            return;
        }


        /* البحث عن رابط فعال */

        let result = await db
            .from("customer_portal_tokens")
            .select("id,token,is_active")
            .eq("customer_id", customerId)
            .eq("is_active", true)
            .order("id", {ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;


        let token = result.data?.[0];


        /* إنشاء رابط لو مش موجود */

        if(!token){

            const newToken =
                crypto.randomUUID().replace(/-/g,"") +
                crypto.randomUUID().replace(/-/g,"");


            result = await db
                .from("customer_portal_tokens")
                .insert({
                    customer_id: customerId,
                    token: newToken,
                    is_active: true
                })
                .select()
                .single();


            if(result.error)
                throw result.error;


            token = result.data;

        }


        const portalUrl =
            new URL(
                "client.html",
                window.location.href
            ).href
            +
            "?token="
            +
            encodeURIComponent(token.token);


        openModal(

            "رابط بوابة العميل",

            `
            <div>

                <div style="
                    margin-bottom:10px;
                    color:var(--muted);
                ">
                    العميل
                </div>

                <h3 style="
                    margin-top:0;
                    color:var(--gold2);
                ">
                    ${esc(customer.client_name)}
                </h3>


                <div style="
                    background:var(--panel2);
                    border:1px solid var(--border);
                    border-radius:10px;
                    padding:12px;
                    word-break:break-all;
                    direction:ltr;
                    text-align:left;
                    margin-bottom:15px;
                ">
                    ${esc(portalUrl)}
                </div>


                <div style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:8px;
                ">

                    <button
                        class="gold-btn"
                        onclick="
                            copyCustomerPortal(
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-solid fa-copy"></i>
                        نسخ الرابط
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            window.open(
                                '${portalUrl}',
                                '_blank'
                            )
                        "
                    >
                        <i class="fa-solid fa-link"></i>
                        فتح البوابة
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            sendPortalWhatsApp(
                                ${customerId},
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                        إرسال واتساب
                    </button>


                    <button
                        class="red-btn"
                        onclick="
                            deactivateCustomerPortal(
                                ${customerId}
                            )
                        "
                    >
                        <i class="fa-solid fa-link-slash"></i>
                        إلغاء الرابط
                    </button>

                </div>

            </div>
            `,

            `
            <button
                class="ghost-btn"
                onclick="closeModal()"
            >
                إغلاق
            </button>
            `

        );


    }catch(error){

        console.error(error);

        showToast(
            "حدث خطأ: " + error.message,
            true
        );

    }

}

/* إرسال رابط العميل على واتساب */

function sendPortalWhatsApp(customerId, link){

    const customer =
        getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    if(!customer.phone){
        showToast("لا يوجد رقم هاتف للعميل", true);
        return;
    }


    let number =
        String(customer.phone)
        .replace(/\D/g,"");


    if(number.startsWith("0")){
        number =
            "20" +
            number.substring(1);
    }


    const message =
        "السلام عليكم " +
        (customer.client_name || "") +
        "\n\n" +
        "يمكنك متابعة اشتراكاتك والمدفوعات الخاصة بك من خلال بوابة العميل:\n\n" +
        link +
        "\n\n" +
        "BADGEIFY";


    window.open(
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
    );

}

        );


    }catch(error){

        console.error(error);

        showToast(

            true
        );

    }

}

    </div>


    <div class="card">

        <div class="card-body">

        <div class="list">

        ${
        rows.map(function(row){

            return `

            <div class="list-item">

                <div>

                    <b>
                    ${esc(row.action)}
                    </b>

                    <div class="muted">
                    ${esc(row.description||"")}
                    </div>

                </div>

                <span class="muted">

                ${new Date(
                    row.created_at
                ).toLocaleString(
                    state.lang==="ar"
                    ?"ar-EG"
                    :"en-GB"
                )}

                </span>

            </div>

            `;

        }).join("")
        ||
        `<div class="empty">${t("noData")}</div>`
        }

        </div>

        </div>

    </div>

    `;

}


/* =========================================
   REFRESH / RENDER
========================================= */

async function refresh(){

    try{

        await loadData();

        render();

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


function render(){

    applyTheme();

    document
    .querySelectorAll(".nav button")
    .forEach(function(button){

        button.classList.toggle(
            "active",
            button.dataset.page
            ===state.page
        );

    });


    document.getElementById(
        "pageTitle"
    ).textContent=
    t(state.page);


    const pages={

        dashboard:renderDashboard,

        customers:renderCustomers,

        traders:renderTraders,

        services:renderServices,

        subscriptions:
        renderSubscriptions,

        payments:
        renderPayments,

        invoices:
        renderInvoices,

        followups:
        renderFollowups,

        settings:
        renderSettings,

        activity:
        renderActivity

    };


    (
        pages[state.page]
        ||
        renderDashboard
    )();

}


/* =========================================
   LOGIN
========================================= */

document.getElementById(
    "loginBtn"
).onclick=async function(){

    const email=
    document.getElementById(
        "loginEmail"
    ).value;

    const password=
    document.getElementById(
        "loginPassword"
    ).value;

    document.getElementById(
        "loginMsg"
    ).textContent="...";


    const result=
    await db.auth.signInWithPassword({

        email:email,

        password:password

    });


    if(result.error){

        document.getElementById(
            "loginMsg"
        ).textContent=
        result.error.message;

    }else{

        document.getElementById(
            "loginMsg"
        ).textContent="";

    }

};


document.getElementById(
    "logoutBtn"
).onclick=async function(){

    await db.auth.signOut();

};


document.getElementById(
    "refreshBtn"
).onclick=
refresh;


/* =========================================
   AUTH
========================================= */

db.auth.onAuthStateChange(
async function(event,session){

    currentUser=
    session?.user||null;

    if(currentUser){

        document
        .getElementById(
            "loginView"
        )
        .classList
        .add("hidden");

        document
        .getElementById(
            "appView"
        )
        .classList
        .remove("hidden");

        await refresh();

    }else{

        document
        .getElementById(
            "loginView"
        )
        .classList
        .remove("hidden");

        document
        .getElementById(
            "appView"
        )
        .classList
        .add("hidden");

    }

});


/* =========================================
   INITIAL
========================================= */

applyTheme();


</script>

</body>
</html>
