<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BADGEIFY | إدارة العملاء والاشتراكات</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: "Tajawal", sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top right, rgba(212,175,55,.10), transparent 30%),
                radial-gradient(circle at bottom left, rgba(212,175,55,.06), transparent 30%),
                #080808;
            color: #fff;
            min-height: 100vh;
        }

        .gold {
            color: #d4af37;
        }

        .gold-bg {
            background: linear-gradient(135deg, #d4af37, #f4d77d, #b88a14);
        }

        .glass {
            background: rgba(20,20,20,.78);
            border: 1px solid rgba(212,175,55,.15);
            backdrop-filter: blur(15px);
        }

        .card {
            background: linear-gradient(145deg, rgba(25,25,25,.96), rgba(12,12,12,.96));
            border: 1px solid rgba(212,175,55,.13);
            box-shadow: 0 15px 45px rgba(0,0,0,.25);
        }

        .input {
            width: 100%;
            background: #111;
            border: 1px solid #292929;
            color: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            outline: none;
            transition: .2s;
        }

        .input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,.08);
        }

        select.input option {
            background: #111;
            color: white;
        }

        .btn {
            border-radius: 12px;
            padding: 11px 16px;
            font-weight: 700;
            transition: .2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-gold {
            background: linear-gradient(135deg,#d4af37,#f0d46c);
            color: #080808;
        }

        .btn-dark {
            background: #171717;
            border: 1px solid #303030;
            color: #fff;
        }

        .btn-danger {
            background: rgba(220,38,38,.12);
            color: #f87171;
            border: 1px solid rgba(220,38,38,.25);
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            color: #aaa;
            transition: .2s;
            text-align: right;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: rgba(212,175,55,.1);
            color: #d4af37;
        }

        .modal-bg {
            background: rgba(0,0,0,.78);
            backdrop-filter: blur(8px);
        }

        .modal-box {
            max-height: 90vh;
            overflow-y: auto;
        }

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #090909;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .loader-ring {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid rgba(212,175,55,.15);
            border-top-color: #d4af37;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-gold {
            animation: pulseGold 1.8s infinite;
        }

        @keyframes pulseGold {
            0%,100% {
                box-shadow: 0 0 0 0 rgba(212,175,55,.20);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(212,175,55,0);
            }
        }

        .table-row:hover {
            background: rgba(255,255,255,.025);
        }

        .status-active {
            color: #4ade80;
            background: rgba(74,222,128,.08);
            border: 1px solid rgba(74,222,128,.15);
        }

        .status-expired {
            color: #f87171;
            background: rgba(248,113,113,.08);
            border: 1px solid rgba(248,113,113,.15);
        }

        .status-paused {
            color: #fbbf24;
            background: rgba(251,191,36,.08);
            border: 1px solid rgba(251,191,36,.15);
        }

        .mobile-menu {
            transform: translateX(100%);
            transition: .25s;
        }

        .mobile-menu.open {
            transform: translateX(0);
        }
    </style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen"
     class="fixed inset-0 z-[9999] bg-[#050505] flex items-center justify-center">

    <div class="text-center">
        <div class="w-20 h-20 mx-auto mb-6 rounded-3xl gold-bg flex items-center justify-center shadow-2xl">
            <span class="text-3xl font-black text-black">B</span>
        </div>

        <div class="text-3xl font-black tracking-[.2em] gold">
            BADGEIFY
        </div>

        <div class="text-gray-500 mt-2">
            CRM & Subscription Management
        </div>

        <div class="loader-ring mx-auto mt-8"></div>
    </div>
</div>


<!-- LOGIN -->
<div id="loginScreen" class="hidden min-h-screen items-center justify-center p-5">

    <div class="w-full max-w-md card rounded-3xl p-8">

        <div class="text-center mb-8">

            <div class="w-20 h-20 mx-auto rounded-3xl gold-bg flex items-center justify-center mb-5">
                <span class="text-4xl font-black text-black">B</span>
            </div>

            <h1 class="text-3xl font-black gold">
                BADGEIFY
            </h1>

            <p class="text-gray-500 mt-2">
                نظام إدارة العملاء والاشتراكات
            </p>
        </div>

        <form id="loginForm">

            <label class="block text-sm text-gray-400 mb-2">
                البريد الإلكتروني
            </label>

            <input
                id="loginEmail"
                type="email"
                class="input mb-5"
                placeholder="example@email.com"
                required
            >

            <label class="block text-sm text-gray-400 mb-2">
                كلمة المرور
            </label>

            <div class="relative">

                <input
                    id="loginPassword"
                    type="password"
                    class="input pl-12"
                    placeholder="••••••••"
                    required
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white">
                    👁
                </button>

            </div>

            <button
                type="submit"
                class="btn btn-gold w-full mt-6">
                تسجيل الدخول
            </button>

            <div id="loginError"
                 class="hidden mt-4 text-center text-red-400 text-sm">
            </div>

        </form>
    </div>
</div>


<!-- APP -->
<div id="app" class="hidden min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar"
           class="fixed right-0 top-0 bottom-0 w-72 bg-[#0b0b0b] border-l border-[#202020] z-50 hidden lg:block">

        <div class="p-6 border-b border-[#202020]">

            <div class="flex items-center gap-3">

                <div class="w-12 h-12 rounded-2xl gold-bg flex items-center justify-center">
                    <span class="text-2xl font-black text-black">B</span>
                </div>

                <div>
                    <div class="font-black gold text-xl">
                        BADGEIFY
                    </div>

                    <div class="text-xs text-gray-500">
                        Management System
                    </div>
                </div>

            </div>

        </div>

        <nav class="p-4 space-y-1">

            <button class="nav-btn active" data-page="dashboard">
                <span>⌂</span>
                <span>الرئيسية</span>
            </button>

            <button class="nav-btn" data-page="customers">
                <span>♙</span>
                <span>العملاء</span>
            </button>

            <button class="nav-btn" data-page="subscriptions">
                <span>◈</span>
                <span>الاشتراكات</span>
            </button>

            <button class="nav-btn" data-page="payments">
                <span>▣</span>
                <span>المدفوعات</span>
            </button>

            <button class="nav-btn" data-page="services">
                <span>◇</span>
                <span>الخدمات</span>
            </button>

            <div class="pt-5 pb-2 px-3 text-xs text-gray-600">
                قريباً
            </div>

            <button class="nav-btn" disabled>
                <span>▤</span>
                <span>الفواتير</span>
            </button>

            <button class="nav-btn" disabled>
                <span>✓</span>
                <span>المهام والمتابعة</span>
            </button>

            <button class="nav-btn" disabled>
                <span>◷</span>
                <span>سجل النشاط</span>
            </button>

            <button class="nav-btn" disabled>
                <span>⚙</span>
                <span>الإعدادات</span>
            </button>

        </nav>

        <div class="absolute bottom-0 right-0 left-0 p-4 border-t border-[#202020]">

            <div class="flex items-center gap-3 mb-3">

                <div class="w-10 h-10 rounded-full bg-[#181818] flex items-center justify-center gold">
                    U
                </div>

                <div class="min-w-0">
                    <div id="userEmail"
                         class="text-sm truncate text-gray-300">
                    </div>

                    <div class="text-xs text-gray-600">
                        مستخدم النظام
                    </div>
                </div>

            </div>

            <button onclick="logout()"
                    class="btn btn-dark w-full text-sm">
                تسجيل الخروج
            </button>

        </div>

    </aside>


    <!-- MOBILE SIDEBAR -->
    <div id="mobileMenu"
         class="mobile-menu fixed right-0 top-0 bottom-0 w-72 bg-[#0b0b0b] z-[100] lg:hidden border-l border-[#222]">

        <div class="p-5 flex justify-between items-center border-b border-[#222]">

            <span class="gold font-black text-xl">
                BADGEIFY
            </span>

            <button onclick="toggleMobileMenu()"
                    class="text-gray-400 text-2xl">
                ×
            </button>

        </div>

        <div class="p-4 space-y-1">

            <button class="nav-btn active" data-page="dashboard">
                ⌂ <span>الرئيسية</span>
            </button>

            <button class="nav-btn" data-page="customers">
                ♙ <span>العملاء</span>
            </button>

            <button class="nav-btn" data-page="subscriptions">
                ◈ <span>الاشتراكات</span>
            </button>

            <button class="nav-btn" data-page="payments">
                ▣ <span>المدفوعات</span>
            </button>

            <button class="nav-btn" data-page="services">
                ◇ <span>الخدمات</span>
            </button>

            <button onclick="logout()" class="nav-btn text-red-400 mt-5">
                ⇥ <span>تسجيل الخروج</span>
            </button>

        </div>
    </div>


    <!-- MAIN -->
    <main class="lg:mr-72 min-h-screen">

        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-[#080808]/90 backdrop-blur-xl border-b border-[#202020]">

            <div class="px-4 md:px-7 py-4 flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <button onclick="toggleMobileMenu()"
                            class="lg:hidden btn btn-dark px-3">
                        ☰
                    </button>

                    <div>
                        <h1 id="pageTitle"
                            class="font-black text-xl md:text-2xl">
                            الرئيسية
                        </h1>

                        <p id="pageSubtitle"
                           class="text-xs md:text-sm text-gray-600">
                            نظرة عامة على النظام
                        </p>
                    </div>

                </div>

                <button
                    onclick="refreshCurrentPage()"
                    class="btn btn-dark">
                    تحديث
                </button>

            </div>

        </header>


        <!-- CONTENT -->
        <div id="content"
             class="p-4 md:p-7">
        </div>

    </main>
</div>


<!-- MODAL -->
<div id="modal"
     class="hidden fixed inset-0 z-[200] modal-bg items-center justify-center p-4">

    <div id="modalContent"
         class="modal-box w-full max-w-2xl card rounded-3xl p-6 fade-in">
    </div>

</div>


<!-- CONFIRM -->
<div id="confirmModal"
     class="hidden fixed inset-0 z-[300] modal-bg items-center justify-center p-4">

    <div class="card rounded-3xl p-7 w-full max-w-md text-center">

        <div class="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center mx-auto mb-5 text-2xl">
            !
        </div>

        <h3 id="confirmTitle"
            class="font-black text-xl">
            تأكيد العملية
        </h3>

        <p id="confirmText"
           class="text-gray-500 mt-2">
            هل أنت متأكد؟
        </p>

        <div class="flex gap-3 mt-7">

            <button
                onclick="closeConfirm()"
                class="btn btn-dark flex-1">
                إلغاء
            </button>

            <button
                id="confirmButton"
                class="btn btn-danger flex-1">
                تأكيد
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->
<div id="toast"
     class="fixed bottom-5 left-5 z-[500] hidden">

    <div id="toastBox"
         class="card rounded-2xl px-5 py-4 min-w-[280px]">

        <div id="toastMessage"
             class="text-sm">
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://rsvzachgbqsucqgrwguv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jn8QNpKQ8v7awUj2wYANdw_wcliO986";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentPage = "dashboard";

let customers = [];
let subscriptions = [];
let payments = [];
let services = [];

let currentUser = null;


/* =========================
   INITIALIZATION
========================= */

document.addEventListener("DOMContentLoaded", async () => {

    await new Promise(resolve => setTimeout(resolve, 1200));

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    document.getElementById("loadingScreen").classList.add("hidden");

    if (session) {

        currentUser = session.user;

        showApp();

    } else {

        showLogin();

    }

});


/* =========================
   AUTH
========================= */

function showLogin() {

    document.getElementById("loginScreen")
        .classList.remove("hidden");

    document.getElementById("loginScreen")
        .classList.add("flex");

    document.getElementById("app")
        .classList.add("hidden");
}


function showApp() {

    document.getElementById("loginScreen")
        .classList.add("hidden");

    document.getElementById("loginScreen")
        .classList.remove("flex");

    document.getElementById("app")
        .classList.remove("hidden");

    document.getElementById("userEmail").textContent =
        currentUser?.email || "";

    loadPage("dashboard");
}


async function login(event) {

    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");

    error.classList.add("hidden");

    const { data, error: authError } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (authError) {

        error.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        error.classList.remove("hidden");

        return;
    }

    currentUser = data.user;

    showApp();
}


async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    document.getElementById("app")
        .classList.add("hidden");

    showLogin();
}


function togglePassword() {

    const input =
        document.getElementById("loginPassword");

    input.type =
        input.type === "password"
            ? "text"
            : "password";
}


document
    .getElementById("loginForm")
    .addEventListener("submit", login);


/* =========================
   NAVIGATION
========================= */

document.querySelectorAll(".nav-btn[data-page]")
.forEach(button => {

    button.addEventListener("click", () => {

        const page =
            button.dataset.page;

        loadPage(page);

        toggleMobileMenu(false);
    });

});


function setActiveNav(page) {

    document
        .querySelectorAll(".nav-btn[data-page]")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.page === page
            );

        });

}


async function loadPage(page) {

    currentPage = page;

    setActiveNav(page);

    const titles = {

        dashboard: [
            "الرئيسية",
            "نظرة عامة على النظام"
        ],

        customers: [
            "العملاء",
            "إدارة بيانات العملاء"
        ],

        subscriptions: [
            "الاشتراكات",
            "إدارة اشتراكات العملاء"
        ],

        payments: [
            "المدفوعات",
            "متابعة عمليات الدفع"
        ],

        services: [
            "الخدمات",
            "إدارة الخدمات والباقات"
        ]

    };

    document.getElementById("pageTitle").textContent =
        titles[page][0];

    document.getElementById("pageSubtitle").textContent =
        titles[page][1];

    if (page === "dashboard")
        await renderDashboard();

    if (page === "customers")
        await renderCustomers();

    if (page === "subscriptions")
        await renderSubscriptions();

    if (page === "payments")
        await renderPayments();

    if (page === "services")
        await renderServices();
}


async function refreshCurrentPage() {

    await loadPage(currentPage);

    toast("تم تحديث البيانات");
}


/* =========================
   DATA
========================= */

async function loadCustomers() {

    const { data, error } =
        await supabaseClient
            .from("customers")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    if (error) {

        console.error(error);

        toast(
            "حدث خطأ أثناء تحميل العملاء",
            "error"
        );

        return [];

    }

    customers = data || [];

    return customers;
}


async function loadSubscriptions() {

    const { data, error } =
        await supabaseClient
            .from("subscriptions")
            .select(`
                *,
                customers (
                    id,
                    client_name,
                    phone
                )
            `)
            .order("created_at", {
                ascending: false
            });

    if (error) {

        console.error(error);

        toast(
            "حدث خطأ أثناء تحميل الاشتراكات",
            "error"
        );

        return [];

    }

    subscriptions = data || [];

    return subscriptions;
}


async function loadPayments() {

    const { data, error } =
        await supabaseClient
            .from("subscription_payments")
            .select(`
                *,
                subscriptions (
                    id,
                    page_name,
                    monthly_fee,
                    customers (
                        id,
                        client_name,
                        phone
                    )
                )
            `)
            .order("payment_date", {
                ascending: false
            });

    if (error) {

        console.error(error);

        toast(
            "حدث خطأ أثناء تحميل المدفوعات",
            "error"
        );

        return [];

    }

    payments = data || [];

    return payments;
}


async function loadServices() {

    const { data, error } =
        await supabaseClient
            .from("services")
            .select("*")
            .order("id", {
                ascending: false
            });

    if (error) {

        console.error(error);

        toast(
            "تعذر تحميل الخدمات",
            "error"
        );

        return [];

    }

    services = data || [];

    return services;
}


/* =========================
   DASHBOARD
========================= */

async function renderDashboard() {

    const [
        customersData,
        subscriptionsData,
        paymentsData
    ] = await Promise.all([
        loadCustomers(),
        loadSubscriptions(),
        loadPayments()
    ]);

    const activeSubscriptions =
        subscriptionsData.filter(
            s => s.status === "active"
        );

    const today =
        new Date();

    const dueSoon =
        subscriptionsData.filter(s => {

            if (!s.renewal_date)
                return false;

            const date =
                new Date(s.renewal_date);

            const diff =
                Math.ceil(
                    (date - today) /
                    (1000 * 60 * 60 * 24)
                );

            return diff >= 0 && diff <= 7;

        });

    const totalMonthly =
        activeSubscriptions.reduce(
            (sum, s) =>
                sum + Number(s.monthly_fee || 0),
            0
        );

    const totalPayments =
        paymentsData.reduce(
            (sum, p) =>
                sum + Number(p.amount || 0),
            0
        );

    document.getElementById("content").innerHTML = `

        <div class="fade-in">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-7">

                <div>
                    <h2 class="text-2xl font-black">
                        أهلاً بك في <span class="gold">BADGEIFY</span>
                    </h2>

                    <p class="text-gray-600 mt-1">
                        هذه نظرة سريعة على حالة النظام.
                    </p>
                </div>

                <button
                    onclick="openCustomerModal()"
                    class="btn btn-gold">
                    + إضافة عميل
                </button>

            </div>


            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">

                ${statCard(
                    "إجمالي العملاء",
                    customersData.length,
                    "♙"
                )}

                ${statCard(
                    "الاشتراكات النشطة",
                    activeSubscriptions.length,
                    "◈"
                )}

                ${statCard(
                    "دخل الاشتراكات الشهري",
                    formatMoney(totalMonthly),
                    "₤"
                )}

                ${statCard(
                    "إجمالي المدفوعات",
                    formatMoney(totalPayments),
                    "▣"
                )}

            </div>


            <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mt-5">

                <div class="xl:col-span-2 card rounded-3xl p-5">

                    <div class="flex justify-between items-center mb-5">

                        <div>
                            <h3 class="font-black text-lg">
                                الاشتراكات القريبة من التجديد
                            </h3>

                            <p class="text-xs text-gray-600 mt-1">
                                خلال 7 أيام
                            </p>
                        </div>

                        <button
                            onclick="loadPage('subscriptions')"
                            class="text-sm gold">
                            عرض الكل
                        </button>

                    </div>

                    ${
                        dueSoon.length

async function saveCustomer(event, id) {

    event.preventDefault();

    const payload = {

        client_name:
            document.getElementById("customerName").value.trim(),

        client_type:
            document.getElementById("customerType").value,

        phone:
            document.getElementById("customerPhone").value.trim(),

        page_link:
            document.getElementById("customerLink").value.trim(),

        notes:
            document.getElementById("customerNotes").value.trim(),

        status:
            document.getElementById("customerStatus").value

    };


    let result;

    if (id) {

        result =
            await supabaseClient
                .from("customers")
                .update(payload)
                .eq("id", id);

    } else {

        result =
            await supabaseClient
                .from("customers")
                .insert(payload);

    }


    if (result.error) {

        console.error(result.error);

        toast(
            result.error.message,
            "error"
        );

        return;
    }


    closeModal();

    toast(
        id
        ? "تم تعديل العميل"
        : "تم إضافة العميل"
    );

    await loadPage("customers");
}


function confirmDeleteCustomer(id) {

    const customer =
        customers.find(
            c => Number(c.id) === Number(id)
        );

    showConfirm(
        "حذف العميل",
        `سيتم حذف العميل "${customer?.client_name || ""}" وجميع اشتراكاته المرتبطة به. هل تريد المتابعة؟`,
        async () => {

            const { error } =
                await supabaseClient
                    .from("customers")
                    .delete()
                    .eq("id", id);

            if (error) {

                toast(
                    error.message,
                    "error"
                );

                return;
            }

            closeConfirm();

            toast("تم حذف العميل");

            await loadPage("customers");

        }
    );
}

        await supabaseClient

                (customerSubs || []).map(s => s.id).length

async function saveSubscription(event, id) {

    event.preventDefault();


    const customerId =
        document
            .getElementById("subscriptionCustomer")
            .value;


    if (!customerId) {

        toast(
            "يجب اختيار العميل",
            "error"
        );

        return;
    }


    const payload = {

        customer_id:
            Number(customerId),

        service_id:
            document.getElementById("subscriptionService").value
                || null,

        page_name:
            document.getElementById("subscriptionPage").value.trim(),

        platform:
            document.getElementById("subscriptionPlatform").value,

        page_link:
            document.getElementById("subscriptionLink").value.trim(),

        monthly_fee:
            Number(
                document.getElementById("subscriptionFee").value
                || 0
            ),

        currency:
            document.getElementById("subscriptionCurrency").value,

        payment_day:
            numberOrNull(
                document.getElementById("subscriptionPaymentDay").value
            ),

        renewal_day:
            numberOrNull(
                document.getElementById("subscriptionRenewalDay").value
            ),

        start_date:
            document.getElementById("subscriptionStartDate").value
            || null,

        renewal_date:
            document.getElementById("subscriptionRenewalDate").value
            || null,

        status:
            document.getElementById("subscriptionStatus").value,

        notes:
            document.getElementById("subscriptionNotes").value.trim()

    };


    let result;

    if (id) {

        result =
            await supabaseClient
                .from("subscriptions")
                .update(payload)
                .eq("id", id);

    } else {

        result =
            await supabaseClient
                .from("subscriptions")
                .insert(payload);

    }


    if (result.error) {

        console.error(result.error);

        toast(
            result.error.message,
            "error"
        );

        return;
    }


    closeModal();

    toast(
        id
        ? "تم تعديل الاشتراك"
        : "تم إضافة الاشتراك"
    );

    await loadPage("subscriptions");
}


function confirmDeleteSubscription(id) {

    showConfirm(
        "حذف الاشتراك",
        "هل أنت متأكد من حذف هذا الاشتراك؟",
        async () => {

            const { error } =
                await supabaseClient
                    .from("subscriptions")
                    .delete()
                    .eq("id", id);

            if (error) {

                toast(
                    error.message,
                    "error"
                );

                return;
            }

            closeConfirm();

            toast("تم حذف الاشتراك");

            await loadPage("subscriptions");

        }
    );
}

function paymentsRows(list) {

    if (!list.length) {

        return `
            <tr>
                <td colspan="5"
                    class="p-12 text-center text-gray-600">
                    لا توجد مدفوعات.
                </td>
            </tr>
        `;

    }

    return list.map(p => `

        <tr class="table-row border-t border-[#1d1d1d]">

            <td class="p-4 font-bold">
                ${escapeHtml(
                    p.subscriptions?.customers?.client_name || "-"
                )}
            </td>

            <td class="p-4 text-gray-400">
                ${escapeHtml(
                    p.subscriptions?.page_name || "-"
                )}
            </td>

            <td class="p-4 gold font-black">
                ${formatMoney(p.amount)}
                ${escapeHtml(p.currency || "EGP")}
            </td>

            <td class="p-4 text-gray-400">
                ${escapeHtml(p.paid_month || "-")}
            </td>

            <td class="p-4 text-gray-500">
                ${formatDate(p.payment_date)}
            </td>

        </tr>

    `).join("");
}


function filterPayments() {

    const value =
        document
            .getElementById("paymentSearch")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        payments.filter(p => {

            const client =
                p.subscriptions?.customers?.client_name || "";

            const page =
                p.subscriptions?.page_name || "";

            return (
                client.toLowerCase().includes(value)
                ||
                page.toLowerCase().includes(value)
            );

        });

    document.getElementById("paymentsTable")
        .innerHTML =
        paymentsRows(filtered);
}

/* =========================
   HELPERS
========================= */

function subscriptionRow(s) {

    return `
        <div class="bg-[#111] border border-[#202020] rounded-2xl p-4">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">

                <div>

                    <div class="font-bold">
                        ${escapeHtml(
                            s.customers?.client_name || "-"
                        )}
                    </div>

                    <div class="text-xs text-gray-600 mt-1">
                        ${escapeHtml(s.page_name || "بدون اسم صفحة")}
                    </div>

                </div>

                <div class="flex items-center gap-4">

                    <div class="text-right">

                        <div class="gold font-bold">
                            ${formatMoney(s.monthly_fee)}
                            ${escapeHtml(s.currency || "EGP")}
                        </div>

                        <div class="text-xs text-gray-600">
                            التجديد:
                            ${formatDate(s.renewal_date)}
                        </div>

                    </div>

                    ${statusBadge(s)}

                </div>

            </div>

        </div>
    `;
}


function statusBadge(s) {

    let cls = "status-active";
    let text = "نشط";

    if (s.status === "expired") {
        cls = "status-expired";
        text = "منتهي";
    }

    if (s.status === "paused") {
        cls = "status-paused";
        text = "متوقف";
    }

    if (s.renewal_date) {

        const date =
            new Date(s.renewal_date);

        const today =
            new Date();

        const diff =
            Math.ceil(
                (date - today) /
                (1000 * 60 * 60 * 24)
            );

        if (diff < 0) {

            cls = "status-expired";
            text = "منتهي";

        } else if (diff <= 7) {

            cls = "status-paused";
            text = "قريب التجديد";

        }

    }

    return `
        <span class="px-3 py-1 rounded-full text-xs ${cls}">
            ${text}
        </span>
    `;
}


function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });
}


function formatDate(value) {

    if (!value)
        return "-";

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime()))
        return value;

    return date.toLocaleDateString(
        "ar-EG",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}


function todayDate() {

    const d = new Date();

    return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}


function numberOrNull(value) {

    if (value === "" || value === null)
        return null;

    return Number(value);
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttr(value) {

    return escapeHtml(value);
}


/* =========================
   MODALS
========================= */

function openModal(html) {

    document.getElementById("modalContent")
        .innerHTML = html;

    document.getElementById("modal")
        .classList.remove("hidden");

    document.getElementById("modal")
        .classList.add("flex");
}


function closeModal() {

    document.getElementById("modal")
        .classList.add("hidden");

    document.getElementById("modal")
        .classList.remove("flex");
}


function showConfirm(title, text, action) {

    document.getElementById("confirmTitle")
        .textContent = title;

    document.getElementById("confirmText")
        .textContent = text;

    document.getElementById("confirmButton")
        .onclick = action;

    document.getElementById("confirmModal")
        .classList.remove("hidden");

    document.getElementById("confirmModal")
        .classList.add("flex");
}


function closeConfirm() {

    document.getElementById("confirmModal")
        .classList.add("hidden");

    document.getElementById("confirmModal")
        .classList.remove("flex");
}


/* =========================
   TOAST
========================= */

function toast(message, type = "success") {

    const element =
        document.getElementById("toast");

    const box =
        document.getElementById("toastBox");

    const text =
        document.getElementById("toastMessage");

    text.textContent = message;

    box.style.borderColor =
        type === "error"
        ? "rgba(248,113,113,.3)"
        : "rgba(212,175,55,.25)";

    element.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            element.classList.add("hidden");

        }, 3000);
}


/* =========================
   WHATSAPP
========================= */

function openWhatsApp(phone, name = "") {

    let number =
        String(phone || "")
            .replace(/\D/g, "");

    if (number.startsWith("0"))
        number = "20" + number.substring(1);

    const message =
        encodeURIComponent(
            `أهلاً ${name}، معك BADGEIFY.`
        );

    window.open(
        `https://wa.me/${number}?text=${message}`,
        "_blank"
    );
}

function toggleMobileMenu(force) {

    const menu =
        document.getElementById("mobileMenu");

    if (force === false) {

        menu.classList.remove("open");

        return;
    }

    menu.classList.toggle("open");
}
