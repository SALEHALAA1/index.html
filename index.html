<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>BADGEIFY - Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center">

    <!-- Launch/Login Screen -->
    <div id="login-screen" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-indigo-400 tracking-wider">BADGEIFY</h1>
            <p class="text-slate-400 text-sm mt-2">نظام الإدارة والتحكم الذكي</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white"
                    placeholder="admin@badgeify.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white"
                    placeholder="••••••••">
            </div>

            <div id="login-error" class="hidden text-rose-400 text-sm text-center bg-rose-950/50 py-2 rounded-lg border border-rose-900"></div>

            <button type="submit" id="login-btn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30">
                دخول للنظام
            </button>
        </form>
    </div>

    <!-- Dashboard Screen (Hidden by default) -->
    <div id="dashboard-screen" class="hidden w-full min-h-screen bg-slate-900 flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-slate-800 border-b border-slate-700 px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xl font-black text-indigo-400">BADGEIFY</span>
                <span class="text-xs bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-800">لوحة التحكم</span>
            </div>
            <button id="logout-btn" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white text-sm font-medium rounded-lg transition-all border border-rose-800/50">
                تسجيل الخروج
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-8">
            <div class="max-w-7xl mx-auto">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-xl font-bold text-white mb-2">أهلاً بك يا فنان في نظام Badgeify</h2>
                    <p class="text-slate-400">تم تسجيل الدخول بنجاح والاتصال بقاعدة البيانات يعمل بكفاءة تامة.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase Logic & App Initialization -->
    <script>
        // إعدادات اتصال Supabase الخاصة بك
        const SUPABASE_URL = 'ضع_رابط_supabase_هنا';
        const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_هنا';
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التحقق من الجلسة النشطة مسبقاً عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                showDashboard();
            }
        });

        // دالة إظهار الداشبورد
        function showDashboard() {
            document.body.classList.remove('items-center', 'justify-center');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        // معالجة تسجيل الدخول بدون أي ريفرش مزعج
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // تمنع إعادة تحميل الصفحة نهائياً
            
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');
            
            btn.textContent = 'جاري التحقق والدخول...';
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await db.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                if (data.session) {
                    showDashboard();
                }
            } catch (error) {
                errorMsg.textContent = 'خطأ في البريد الإلكتروني أو كلمة المرور!';
                errorMsg.classList.remove('hidden');
                btn.textContent = 'دخول للنظام';
            }
        });

        // زر تسجيل الخروج
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await db.auth.signOut();
            location.reload();
        });
    </script>
</body>
</html>
