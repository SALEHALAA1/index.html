<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>BADGEIFY V2 - Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-indigo-400 tracking-wider">BADGEIFY</h1>
            <p class="text-slate-400 text-sm mt-2">نظام الإدارة والتحكم الذكي</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" value="admin@badgeify.com"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white"
                    placeholder="admin@badgeify.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
                <input type="text" id="password" value="12345678"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white"
                    placeholder="••••••••">
            </div>

            <div id="login-error" class="hidden text-rose-400 text-sm text-center bg-rose-950/50 p-3 rounded-lg border border-rose-900 break-words"></div>

            <button type="button" id="login-btn" onclick="handleLogin()" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30 cursor-pointer">
                دخول للنظام
            </button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard-screen" class="hidden w-full min-h-screen bg-slate-900 flex flex-col">
        <header class="bg-slate-800 border-b border-slate-700 px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xl font-black text-indigo-400">BADGEIFY</span>
                <span class="text-xs bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-full border border-indigo-800">لوحة التحكم النشطة</span>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white text-sm font-medium rounded-lg transition-all border border-rose-800/50 cursor-pointer">
                تسجيل الخروج
            </button>
        </header>

        <main class="flex-1 p-8">
            <div class="max-w-7xl mx-auto">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-xl font-bold text-white mb-2">مرحباً بك يا فنان في النظام</h2>
                    <p class="text-slate-400">تم تسجيل الدخول بنجاح تام!</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://rsvzachgbqsucqgrwguv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdnphY2hnYnFzdWNxZ3J3Z3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2ODA5MTYsImV4cCI6MjEwNTI1NjkxNn0.5r-YQOaFhjRDuaqdHTRWP6k-mCb0Z6AY_q2ExN_2wCQ";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('badgeify_logged') === 'true') {
                showDashboard();
            }
        });

        function showDashboard() {
            document.body.classList.remove('items-center', 'justify-center');
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        async function handleLogin() {
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            btn.textContent = 'جاري الفحص...';
            errorMsg.classList.add('hidden');

            try {
                console.log("Starting query to Supabase for:", email);
                
                const { data, error, status } = await db
                    .from('admins')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                console.log("Supabase Response Status:", status);
                console.log("Supabase Response Data:", data);
                console.log("Supabase Response Error:", error);

                if (error) {
                    throw new Error(error.message);
                }

                if (!data || data.length === 0) {
                    throw new Error('لا يوجد مطابقة للبيانات في الجدول (تأكد من إدخال البيانات في قاعدة البيانات)');
                }

                localStorage.setItem('badgeify_logged', 'true');
                showDashboard();

            } catch (err) {
                console.error("Catch Error:", err);
                errorMsg.textContent = 'خطأ تقني: ' + err.message;
                errorMsg.classList.remove('hidden');
                btn.textContent = 'دخول للنظام';
            }
        }

        function handleLogout() {
            localStorage.removeItem('badgeify_logged');
            location.reload();
        }
    </script>
</body>
</html>
